name: Descargar PDFs del Concejo (diario)

# Cron diario: 09:00 UTC = 06:00 Argentina (ART, UTC-3).
# También se puede correr manualmente desde la pestaña Actions.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

# Permisos para que la Action pueda commitear y pushear.
permissions:
  contents: write

# Evita que dos corridas de ESTE workflow se solapen entre sí.
concurrency:
  group: push-main
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ejecutar descarga
        # No fallar el job si la descarga tiene errores parciales: queremos
        # commitear igual lo que sí se haya bajado.
        continue-on-error: true
        run: |
          cd software
          node scripts/descargar-pdfs-concejo.mjs

      - name: Instalar dependencias para procesar PDFs
        # Solo instalamos pdfjs-dist (las demás ya están en package.json del software)
        continue-on-error: true
        run: |
          cd software
          npm install --no-audit --no-fund --silent

      - name: Procesar PDFs (extraer texto)
        # Genera .txt al lado de cada PDF. Idempotente.
        continue-on-error: true
        run: |
          cd software
          node scripts/procesar-pdfs-concejo.mjs

      - name: Indexar resúmenes anuales
        # Regenera src/lib/data/resumenes-anuales.generated.ts a partir del
        # índice y los textos extraídos.
        continue-on-error: true
        run: |
          cd software
          node scripts/indexar-resumenes-anuales.mjs

      - name: Detectar cambios
        id: cambios
        # Siempre se ejecuta, incluso si el step anterior tuvo errores.
        if: always()
        run: |
          git add -A software/data/concejo software/src/lib/data/resumenes-anuales.generated.ts
          if git diff --cached --quiet; then
            echo "hay_cambios=false" >> $GITHUB_OUTPUT
          else
            echo "hay_cambios=true" >> $GITHUB_OUTPUT
            CANTIDAD=$(git diff --cached --numstat | wc -l)
            echo "cantidad=$CANTIDAD" >> $GITHUB_OUTPUT
          fi

      - name: Commit + Push si hay cambios
        if: always() && steps.cambios.outputs.hay_cambios == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(concejo): actualización automática de PDFs (${{ steps.cambios.outputs.cantidad }} archivos)"

          # Otro workflow (scrape-fuentes) corre en el MISMO cron y también
          # pushea a main. Si gana la carrera, main avanza y nuestro push
          # queda 'non-fast-forward' y es rechazado. Reintentamos integrando
          # los commits remotos con rebase antes de cada reintento.
          for intento in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push OK (intento $intento)."
              exit 0
            fi
            echo "Push rechazado (intento $intento). Rebase sobre origin/main y reintento..."
            git pull --rebase --autostash origin main || true
            sleep $((RANDOM % 5 + 3))
          done

          echo "::error::No se pudo pushear a main tras 5 intentos."
          exit 1

      - name: Resumen
        if: always()
        run: |
          echo "## Resultado de la sincronización" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.cambios.outputs.hay_cambios }}" = "true" ]; then
            echo "Se commitearon **${{ steps.cambios.outputs.cantidad }}** archivos nuevos o modificados en \`software/data/concejo/\`." >> $GITHUB_STEP_SUMMARY
          else
            echo "No hubo cambios. El repo ya estaba sincronizado con concejosunchales.gob.ar." >> $GITHUB_STEP_SUMMARY
          fi